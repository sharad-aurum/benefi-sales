<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BeneFi CRM — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#F0F4F8;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#111827}
.wrap{width:400px;max-width:calc(100vw - 32px)}
.brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:32px}
.brand-mark{width:44px;height:44px;background:linear-gradient(135deg,#0F766E,#0D9488);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff}
.brand-name{font-size:24px;font-weight:800;color:#0F766E;letter-spacing:-0.5px}
.brand-sub{font-size:12px;color:#6B7280;font-weight:500}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:32px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.card-title{font-size:18px;font-weight:700;color:#111827;margin-bottom:4px}
.card-sub{font-size:13.5px;color:#6B7280;margin-bottom:24px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.flbl{font-size:12.5px;font-weight:600;color:#374151}
.finp{padding:10px 12px;border:1px solid #D1D5DB;border-radius:8px;font-size:14px;font-family:inherit;color:#111827;outline:none;transition:border-color .15s,box-shadow .15s;background:#fff}
.finp:focus{border-color:#0F766E;box-shadow:0 0 0 3px rgba(15,118,110,.1)}
.pw-wrap{position:relative}
.pw-wrap .finp{width:100%;padding-right:40px}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9CA3AF;font-size:14px;padding:4px}
.pw-toggle:hover{color:#374151}
.btn-submit{width:100%;padding:11px;background:#0F766E;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s;margin-top:4px}
.btn-submit:hover{background:#0D9488;transform:translateY(-1px)}
.btn-submit:active{transform:translateY(0)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.error{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:16px;display:none}
.error.show{display:block}
.footer{text-align:center;margin-top:20px;font-size:12px;color:#9CA3AF}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">B</div>
    <div>
      <div class="brand-name">BeneFi</div>
      <div class="brand-sub">Sales CRM</div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Welcome back</div>
    <div class="card-sub">Sign in to your CRM account</div>
    <div class="error" id="error"></div>
    <form id="login-form">
      <div class="fg">
        <label class="flbl">Email address</label>
        <input class="finp" id="email" type="email" placeholder="you@benefi.ph" autocomplete="email" required>
      </div>
      <div class="fg">
        <label class="flbl">Password</label>
        <div class="pw-wrap">
          <input class="finp" id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" onclick="togglePw()">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-submit" id="submit-btn">Sign In</button>
    </form>
  </div>
  <div class="footer">BeneFi CRM — Internal use only</div>
</div>
<script>
function togglePw(){
  const i=document.getElementById('password');
  i.type=i.type==='password'?'text':'password';
}
document.getElementById('login-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('submit-btn');
  const err=document.getElementById('error');
  btn.disabled=true; btn.textContent='Signing in…'; err.classList.remove('show');
  try{
    const r=await fetch('/api/auth/login',{
      method:'POST',credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})
    });
    const d=await r.json();
    if(!r.ok){err.textContent=d.error||'Login failed.';err.classList.add('show');return;}
    location.href='/';
  }catch(ex){err.textContent='Connection error. Is the server running?';err.classList.add('show');}
  finally{btn.disabled=false;btn.textContent='Sign In';}
});
</script>
</body>
</html>
